<script>
  (function () {
    'use strict';

    var state = {
      products: [],
      categories: [],
      settings: {},
      requestedProductId: String(window.STOREFRONT_REQUESTED_PRODUCT_ID || ''),
      loaded: false
    };

    var elements = {};
    var currencyFormatter = new Intl.NumberFormat('ru-RU', {
      style: 'currency',
      currency: 'RUB',
      maximumFractionDigits: 2
    });

    document.addEventListener('DOMContentLoaded', function () {
      [
        'store-title', 'store-description', 'catalog-tools', 'requested-product-mode',
        'search-input', 'status-filter', 'category-filter', 'reset-filters', 'show-all-products',
        'results-count', 'updated-at', 'loading-state',
        'error-state', 'error-message', 'retry-button', 'empty-state',
        'empty-title', 'empty-message', 'empty-reset-button', 'product-grid',
        'seller-contact-note', 'delivery-note'
      ].forEach(function (id) {
        elements[id] = document.getElementById(id);
      });

      elements['search-input'].addEventListener('input', renderProducts);
      elements['status-filter'].addEventListener('change', renderProducts);
      elements['category-filter'].addEventListener('change', renderProducts);
      elements['reset-filters'].addEventListener('click', resetFilters);
      elements['empty-reset-button'].addEventListener('click', resetFilters);
      elements['retry-button'].addEventListener('click', loadCatalog);
      loadCatalog();
    });

    function loadCatalog() {
      setVisible(elements['loading-state'], true);
      setVisible(elements['error-state'], false);
      setVisible(elements['empty-state'], false);
      setVisible(elements['product-grid'], false);
      elements['results-count'].textContent = 'Загружаем каталог…';

      if (!(window.google && google.script && google.script.run)) {
        showError('Эта страница должна быть открыта из опубликованного приложения Google Apps Script.');
        return;
      }

      google.script.run
        .withSuccessHandler(function (response) {
          if (!response || response.ok !== true) {
            showError(response && response.message ? response.message : 'Не удалось загрузить каталог.');
            return;
          }

          state.products = Array.isArray(response.products) ? response.products : [];
          state.categories = Array.isArray(response.categories) ? response.categories : [];
          state.settings = response.settings || {};
          state.loaded = true;
          applySettings();
          updateProductViewMode();
          fillCategories();
          setVisible(elements['loading-state'], false);
          setVisible(elements['error-state'], false);
          setVisible(elements['product-grid'], true);
          updateTimestamp(response.generatedAt);
          renderProducts();
          scrollToRequestedProduct();
        })
        .withFailureHandler(function () {
          showError('Сервер временно не отвечает. Проверьте подключение и попробуйте ещё раз.');
        })
        .getStorefrontData();
    }

    function applySettings() {
      var settings = state.settings;
      elements['store-title'].textContent = settings.storeTitle || 'Мои вещи';
      elements['store-description'].textContent = settings.storeDescription || 'Каталог вещей, которые ищут новых владельцев.';
      document.title = settings.storeTitle || 'Мои вещи';

      setOptionalNote(elements['seller-contact-note'], settings.sellerContactNote);
      setOptionalNote(elements['delivery-note'], settings.deliveryNote);
    }

    function setOptionalNote(element, value) {
      var text = String(value || '').trim();
      element.textContent = text;
      setVisible(element, Boolean(text));
    }

    function fillCategories() {
      var select = elements['category-filter'];
      while (select.options.length > 1) select.remove(1);

      state.categories.forEach(function (category) {
        var option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        select.appendChild(option);
      });
    }

    function renderProducts() {
      if (!state.loaded) return;

      var query = normalizeText(elements['search-input'].value);
      var selectedCategory = elements['category-filter'].value;
      var selectedStatus = elements['status-filter'].value || 'available';
      var products = state.products.filter(function (product) {
        var text = normalizeText([product.title, product.description, product.category, product.sizeOrVariant, product.condition].join(' '));
        var matchesText = !query || text.indexOf(query) !== -1;
        var matchesCategory = !selectedCategory || product.category === selectedCategory;
        var matchesRequestedProduct = !state.requestedProductId || product.id === state.requestedProductId;
        // A direct link must still open its product even when it is reserved or unavailable.
        var matchesStatus = Boolean(state.requestedProductId) || selectedStatus === 'all' ||
          (selectedStatus === 'available' && product.availabilityLabel === 'В наличии') ||
          (selectedStatus === 'reserved' && product.availabilityLabel === 'Зарезервирован') ||
          (selectedStatus === 'unavailable' && product.availabilityLabel === 'Нет в наличии');
        return matchesText && matchesCategory && matchesRequestedProduct && matchesStatus;
      });

      elements['product-grid'].replaceChildren();
      products.forEach(function (product) {
        elements['product-grid'].appendChild(createProductCard(product));
      });
      elements['results-count'].textContent = 'Найдено товаров: ' + products.length;

      if (products.length === 0) {
        var hasTextOrCategoryFilters = Boolean(query || selectedCategory);
        if (state.requestedProductId) {
          elements['empty-title'].textContent = 'Товар по ссылке не найден';
          elements['empty-message'].textContent = 'Возможно, товар снят с публикации или ссылка устарела. Откройте весь каталог, чтобы продолжить поиск.';
        } else if (!hasTextOrCategoryFilters && selectedStatus === 'available' && state.products.length > 0) {
          elements['empty-title'].textContent = 'Сейчас нет товаров в наличии';
          elements['empty-message'].textContent = 'Выберите «Все статусы», чтобы посмотреть зарезервированные товары и товары без наличия.';
        } else if (!hasTextOrCategoryFilters && selectedStatus !== 'all' && state.products.length > 0) {
          elements['empty-title'].textContent = 'Нет товаров с выбранным статусом';
          elements['empty-message'].textContent = 'Выберите другой статус или покажите все товары.';
        } else {
          elements['empty-title'].textContent = hasTextOrCategoryFilters ? 'Ничего не найдено' : 'Пока нет опубликованных товаров';
          elements['empty-message'].textContent = hasTextOrCategoryFilters
            ? 'Попробуйте изменить запрос, категорию или статус.'
            : 'Новые товары появятся здесь после публикации продавцом.';
        }
        setVisible(elements['empty-state'], true);
        setVisible(elements['product-grid'], false);
      } else {
        setVisible(elements['empty-state'], false);
        setVisible(elements['product-grid'], true);
      }
    }

    function createProductCard(product) {
      var card = document.createElement('article');
      card.className = 'product-card';
      card.id = 'product-' + product.id;
      card.dataset.productId = product.id;

      var media = document.createElement('div');
      media.className = 'product-media';
      media.classList.add('is-placeholder');
      var photoUrls = Array.isArray(product.photos)
        ? product.photos.filter(function (url) { return typeof url === 'string' && url.trim(); }).map(function (url) { return url.trim(); }).slice(0, 3)
        : [];
      if (photoUrls.length) createProductGallery(media, photoUrls, product.title);

      var badgeContainer = document.createElement('div');
      badgeContainer.className = 'product-status-row';
      var badge = document.createElement('span');
      badge.className = 'status-badge ' + statusClass(product.availabilityLabel);
      badge.textContent = product.availabilityLabel || 'Уточнить наличие';
      badge.setAttribute('aria-label', 'Статус товара: ' + (product.availabilityLabel || 'уточнить наличие'));
      badgeContainer.appendChild(badge);

      var body = document.createElement('div');
      body.className = 'product-body';
      appendText(body, 'p', 'product-category', product.category);
      appendText(body, 'h2', 'product-title', product.title);
      appendText(body, 'p', 'product-description', product.description);

      var meta = document.createElement('div');
      meta.className = 'product-meta';
      if (product.sizeOrVariant) appendText(meta, 'span', '', 'Размер / вариант: ' + product.sizeOrVariant);
      if (product.condition) appendText(meta, 'span', '', 'Состояние: ' + product.condition);
      if (product.availabilityLabel === 'В наличии' && product.quantity === 1) {
        appendText(meta, 'span', '', '1 шт.');
      } else if (product.availabilityLabel === 'В наличии' && product.quantity > 1) {
        appendText(meta, 'span', '', 'Осталось: ' + product.quantity + ' шт.');
      } else if (product.availabilityLabel === 'Зарезервирован') {
        appendText(meta, 'span', '', 'Доступность нужно уточнить у продавца.');
      }
      body.appendChild(meta);
      appendText(body, 'p', 'product-price', currencyFormatter.format(Number(product.priceRub)));
      body.appendChild(createProductActions(product));
      card.appendChild(media);
      card.appendChild(badgeContainer);
      card.appendChild(body);
      return card;
    }

    function createProductGallery(media, photos, productTitle) {
      var photoUrls = photos.slice(0, 3);
      var currentIndex = 0;
      var activePhotoUrl = '';
      var image = document.createElement('img');
      image.className = 'product-gallery-main-image';
      image.loading = 'lazy';
      image.decoding = 'async';

      var controls = document.createElement('div');
      controls.className = 'product-gallery-controls';

      var previousButton = document.createElement('button');
      previousButton.type = 'button';
      previousButton.className = 'product-gallery-arrow product-gallery-previous';
      previousButton.setAttribute('aria-label', 'Предыдущая фотография');
      previousButton.textContent = '‹';

      var nextButton = document.createElement('button');
      nextButton.type = 'button';
      nextButton.className = 'product-gallery-arrow product-gallery-next';
      nextButton.setAttribute('aria-label', 'Следующая фотография');
      nextButton.textContent = '›';

      var thumbnails = document.createElement('div');
      thumbnails.className = 'product-gallery-thumbnails';
      thumbnails.setAttribute('aria-label', 'Миниатюры фотографий товара');

      image.addEventListener('load', function () {
        media.classList.remove('is-placeholder');
      });

      image.addEventListener('error', function () {
        var failedIndex = photoUrls.indexOf(activePhotoUrl);
        if (failedIndex < 0) return;

        photoUrls.splice(failedIndex, 1);
        if (!photoUrls.length) {
          image.style.display = 'none';
          media.classList.add('is-placeholder');
          updateControls();
          return;
        }

        if (failedIndex < currentIndex) currentIndex -= 1;
        if (currentIndex >= photoUrls.length) currentIndex = 0;
        setActivePhoto(currentIndex);
      });

      previousButton.addEventListener('click', function () {
        setActivePhoto(currentIndex - 1);
      });
      nextButton.addEventListener('click', function () {
        setActivePhoto(currentIndex + 1);
      });

      controls.appendChild(previousButton);
      controls.appendChild(nextButton);
      controls.appendChild(thumbnails);
      media.appendChild(image);
      media.appendChild(controls);

      function updateControls() {
        var hasMultiplePhotos = photoUrls.length > 1;
        previousButton.hidden = !hasMultiplePhotos;
        nextButton.hidden = !hasMultiplePhotos;
        thumbnails.hidden = !hasMultiplePhotos;
        thumbnails.replaceChildren();

        if (!hasMultiplePhotos) return;

        photoUrls.forEach(function (photoUrl, index) {
          var thumbnailButton = document.createElement('button');
          thumbnailButton.type = 'button';
          thumbnailButton.className = 'product-gallery-thumbnail';
          thumbnailButton.setAttribute('aria-label', 'Показать фотографию ' + (index + 1));
          thumbnailButton.setAttribute('aria-pressed', String(index === currentIndex));
          if (index === currentIndex) thumbnailButton.classList.add('is-active');

          var thumbnailImage = document.createElement('img');
          thumbnailImage.src = photoUrl;
          thumbnailImage.alt = '';
          thumbnailImage.loading = 'lazy';
          thumbnailImage.decoding = 'async';
          thumbnailButton.appendChild(thumbnailImage);
          thumbnailButton.addEventListener('click', function () {
            setActivePhoto(index);
          });
          thumbnails.appendChild(thumbnailButton);
        });
      }

      function setActivePhoto(index) {
        if (!photoUrls.length) return;
        currentIndex = ((index % photoUrls.length) + photoUrls.length) % photoUrls.length;
        activePhotoUrl = photoUrls[currentIndex];
        image.style.display = '';
        image.alt = productTitle
          ? 'Фотография ' + (currentIndex + 1) + ' из ' + photoUrls.length + ' товара: ' + productTitle
          : 'Фотография ' + (currentIndex + 1) + ' из ' + photoUrls.length;
        media.classList.add('is-placeholder');
        image.src = activePhotoUrl;
        updateControls();
      }

      setActivePhoto(0);
    }

    function appendText(parent, tagName, className, value) {
      var element = document.createElement(tagName);
      if (className) element.className = className;
      element.textContent = value === null || value === undefined ? '' : String(value);
      parent.appendChild(element);
      return element;
    }

    function statusClass(label) {
      if (label === 'В наличии') return 'status-available';
      if (label === 'Зарезервирован') return 'status-reserved';
      return 'status-unavailable';
    }

    function createProductActions(product) {
      var actions = document.createElement('div');
      actions.className = 'product-actions';
      var message = makeInquiryMessage(product);
      var productUrl = makeProductUrl(product);

      if (state.settings.sellerTelegramUsername) {
        var telegramUrl = 'https://t.me/' + state.settings.sellerTelegramUsername + '?text=' + encodeURIComponent(message);
        actions.appendChild(createLinkButton('Написать в TG', telegramUrl, 'button button-primary button-contact button-telegram'));
      }
      if (state.settings.maxEnabled) {
        var maxUrl = 'https://max.ru/:share?text=' + encodeURIComponent(message);
        actions.appendChild(createLinkButton('Написать в MAX', maxUrl, 'button button-secondary button-contact button-max'));
      }

      var copyHelp = document.createElement('p');
      copyHelp.className = 'copy-help';
      copyHelp.textContent = 'Кнопка копирует готовое сообщение с названием, кодом, ценой и ссылкой на товар. Затем откройте чат с продавцом в Telegram, MAX или другом мессенджере и вставьте текст.';

      var copyButton = document.createElement('button');
      copyButton.type = 'button';
      copyButton.className = 'button button-quiet button-wide';
      copyButton.textContent = 'Скопировать запрос';
      copyButton.addEventListener('click', function () {
        copyInquiry(message, actions);
      });
      actions.appendChild(copyButton);
      actions.appendChild(copyHelp);

      var formUrl = makePrefilledFormUrl(product, productUrl);
      if (formUrl) {
        actions.appendChild(createLinkButton('Оставить заявку', formUrl, 'button button-quiet button-wide'));
      }

      var feedback = document.createElement('p');
      feedback.className = 'copy-feedback';
      feedback.setAttribute('aria-live', 'polite');
      actions.appendChild(feedback);
      return actions;
    }

    function createLinkButton(label, href, className) {
      var link = document.createElement('a');
      link.className = className;
      link.href = href;
      link.textContent = label;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      return link;
    }

    function makeInquiryMessage(product) {
      var lines = [
        'Здравствуйте! Меня заинтересовал товар:',
        product.title,
        'Код: ' + product.id,
        'Цена: ' + currencyFormatter.format(Number(product.priceRub))
      ];
      var productUrl = makeProductUrl(product);
      if (productUrl) lines.push(productUrl);
      lines.push('Подскажите, пожалуйста, актуально ли наличие?');
      return lines.join('\n');
    }

    function makeProductUrl(product) {
      var baseUrl = window.STOREFRONT_WEB_APP_URL;
      if (!baseUrl) return '';
      var url = new URL(baseUrl);
      url.searchParams.set('product', product.id);
      url.hash = '';
      return url.toString();
    }

    function makePrefilledFormUrl(product, productUrl) {
      var settings = state.settings;
      if (!settings.googleFormUrl || !/^\d+$/.test(String(settings.googleFormProductIdEntry || ''))) {
        return '';
      }
      try {
        var url = new URL(settings.googleFormUrl);
        url.searchParams.set('usp', 'pp_url');
        url.searchParams.set('entry.' + settings.googleFormProductIdEntry, product.id);
        if (/^\d+$/.test(String(settings.googleFormProductUrlEntry || ''))) {
          url.searchParams.set('entry.' + settings.googleFormProductUrlEntry, productUrl);
        }
        return url.toString();
      } catch (error) {
        return '';
      }
    }

    function copyInquiry(message, actions) {
      var feedback = actions.querySelector('.copy-feedback');
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(message).then(function () {
          feedback.textContent = 'Текст скопирован. Вставьте его в чат с продавцом и отправьте.';
        }).catch(function () {
          showCopyPrompt(message, feedback);
        });
        return;
      }
      showCopyPrompt(message, feedback);
    }

    function showCopyPrompt(message, feedback) {
      window.prompt('Скопируйте текст запроса:', message);
      feedback.textContent = 'Окно с текстом открыто. Скопируйте его, затем вставьте в чат с продавцом и отправьте.';
    }

    function normalizeText(value) {
      return String(value || '').toLocaleLowerCase('ru-RU').replace(/ё/g, 'е').trim();
    }

    function updateProductViewMode() {
      var isProductView = Boolean(state.requestedProductId);
      setVisible(elements['catalog-tools'], !isProductView);
      setVisible(elements['requested-product-mode'], isProductView);
    }

    function resetFilters() {
      elements['search-input'].value = '';
      elements['status-filter'].value = 'available';
      elements['category-filter'].value = '';
      state.requestedProductId = '';
      updateProductViewMode();
      renderProducts();
    }

    function updateTimestamp(value) {
      if (!value) {
        elements['updated-at'].textContent = '';
        return;
      }
      var date = new Date(value);
      elements['updated-at'].textContent = Number.isNaN(date.getTime())
        ? ''
        : 'Обновлено: ' + new Intl.DateTimeFormat('ru-RU', { dateStyle: 'short', timeStyle: 'short' }).format(date);
    }

    function showError(message) {
      setVisible(elements['loading-state'], false);
      setVisible(elements['product-grid'], false);
      setVisible(elements['empty-state'], false);
      if (elements['error-message']) elements['error-message'].textContent = message;
      setVisible(elements['error-state'], true);
      elements['results-count'].textContent = 'Каталог недоступен';
    }

    function setVisible(element, visible) {
      if (!element) return;
      element.hidden = !visible;
    }

    function scrollToRequestedProduct() {
      var productId = state.requestedProductId;
      if (!productId) return;
      var target = document.getElementById('product-' + productId);
      if (target) {
        target.classList.add('is-targeted');
        window.setTimeout(function () {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 80);
      }
    }
  })();
</script>
